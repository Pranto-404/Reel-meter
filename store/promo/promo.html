<!doctype html>
<meta charset="utf-8">
<title>Reel Meter promo tile</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 440px; height: 280px; overflow: hidden; }
  body {
    font-family: system-ui, "Segoe UI", sans-serif; color: #fff;
    background: linear-gradient(135deg, #2a78d6 0%, #6250d6 100%);
    display: grid; place-items: center; text-align: center; position: relative;
  }
  .glow { position: absolute; width: 360px; height: 360px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.22), transparent 65%); top: -140px; right: -100px; }
  main { position: relative; display: grid; gap: 16px; justify-items: center; }
  .island {
    display: inline-flex; align-items: center; gap: 10px; background: #000; color: #fff; border-radius: 22px;
    padding: 0 20px; height: 44px; font-weight: 700; font-size: 18px;
    box-shadow: inset 0 0 0 1px rgba(79,155,240,.6), 0 0 22px rgba(79,155,240,.4), 0 10px 28px rgba(0,0,0,.35);
  }
  .eq { display: flex; align-items: center; gap: 3px; height: 18px; }
  .eq i { display: block; width: 4px; border-radius: 2px; background: #34d399; }
  .eq i:nth-child(1) { height: 8px; } .eq i:nth-child(2) { height: 18px; } .eq i:nth-child(3) { height: 12px; }
  .unit { color: #a8a7a0; font-weight: 500; }
  .sep { width: 1px; height: 16px; background: rgba(255,255,255,.25); }
  h1 { font-size: 44px; letter-spacing: -.02em; font-weight: 800; }
  p { font-size: 17px; opacity: .92; font-weight: 500; }
</style>
<div class="glow"></div>
<main>
  <div class="island"><span class="eq"><i></i><i></i><i></i></span><span>42</span><span class="unit">reels</span><span class="sep"></span><span>18m</span></div>
  <h1>Reel Meter</h1>
  <p>Know your scroll. Stay in control.</p>
</main>
