name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: reel-meter-packages
          path: dist/*.zip

  harness:
    name: Real-code browser harness
    continue-on-error: true # informational until it has proven stable on GitHub's machines
    runs-on: ubuntu-latest
    # Runs the real content script and worker against a fake page in headless Chrome (about 90 seconds).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the harness
        run: |
          set +e
          npm run harness 2>&1 | tee harness.log
          code=${PIPESTATUS[0]}
          { echo '```'; tail -60 harness.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
        env:
          CHROME: /usr/bin/google-chrome
          HARNESS_NO_SANDBOX: '1'
