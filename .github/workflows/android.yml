name: Android

# Builds, tests and checks the Android app in android/. Called by ci.yml when Android-related files change,
# and can be run by hand from the Actions tab (Android > Run workflow).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The committed wrapper jar must be the official one before anything runs it.
      - uses: gradle/actions/wrapper-validation@v6

      # Writes the Gradle cache only on main; other branches and pull requests read it. The wrapper picks the
      # Gradle version (android/gradle/wrapper/gradle-wrapper.properties).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test, lint, check privacy and build
        run: >
          ./gradlew --stacktrace
          :core:test
          :app:testDebugUnitTest
          :app:lintDebug
          :app:privacyCheck
          :app:assembleDebug
          :app:bundleRelease

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: reelity-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the release bundle (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: reelity-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Sizes
        run: |
          aab=$(ls app/build/outputs/bundle/release/*.aab)
          apk=$(ls app/build/outputs/apk/debug/*.apk)
          row() { echo "| $1 | $(numfmt --to=iec-i --suffix=B --format=%.1f "$(stat -c%s "$2")") | $(stat -c%s "$2") |"; }
          {
            echo "### Android sizes"
            echo
            echo "| File | Size | Bytes |"
            echo "|---|---|---|"
            row "Release AAB (unsigned, R8)" "$aab"
            row "Debug APK" "$apk"
            echo
            echo "The AAB holds every device configuration; the Play download is smaller (size gate comes later)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/core/build/reports/
          if-no-files-found: ignore
          retention-days: 14
