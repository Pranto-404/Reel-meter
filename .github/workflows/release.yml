name: Release

# Push a tag such as v1.2.4 to publish a GitHub release with the store packages attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match the manifest version
        run: |
          v=$(node -p "require('./manifest.json').version")
          if [ "refs/tags/v$v" != "$GITHUB_REF" ]; then echo "Tag $GITHUB_REF does not match manifest version $v"; exit 1; fi
      - run: npm test
      - run: npm run build
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Reel Meter ${GITHUB_REF_NAME#v}" --generate-notes
