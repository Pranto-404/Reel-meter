org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true

# App version. The release workflow checks that the android-vX.Y.Z tag matches these two values.
VERSION_NAME=0.1.0
# MAJOR*1000000 + MINOR*10000 + PATCH*100 + N, where N is the rc number and 99 for the final release (ROADMAP section 2).
# 0.1.0 final = 0 + 10000 + 0 + 99.
VERSION_CODE=10099
